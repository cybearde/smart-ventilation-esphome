# Board: Generic ESP32-S3 Board (Generic)
# Definition: definitions/boards/generic-esp32s3/manifest.yaml

substitutions:
  device_name: smart-ventilation
  friendly_name: Smart Ventilation
  modbus_address: "1"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  variant: esp32s3
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Smart Ventilati Fallback Hotspot
    password: !secret fallback_ap_password

uart:
  id: rs485_uart
  tx_pin: GPIO17
  rx_pin: GPIO18
  flow_control_pin: GPIO21
  baud_rate: 9600
  data_bits: 8
  parity: EVEN
  stop_bits: 1

modbus:
  id: rs485_bus
  uart_id: rs485_uart
  role: client
  send_wait_time: 1000ms
  turnaround_time: 1000ms

modbus_controller:
  - id: ventilation
    modbus_id: rs485_bus
    address: ${modbus_address}
    update_interval: 30s
    # Applies to reads AND writes: never replay a write after a lost reply.
    max_cmd_retries: 0
    offline_skip_updates: 1
    on_online:
      then:
        - binary_sensor.template.publish:
            id: controller_online
            state: ON
    on_offline:
      then:
        - binary_sensor.template.publish:
            id: controller_online
            state: OFF

binary_sensor:
  - platform: status
    name: Gateway connected
    entity_category: diagnostic
  - platform: template
    id: controller_online
    name: Controller responding
    device_class: connectivity
    entity_category: diagnostic
    # Start unknown; only a Modbus response/timeout establishes connectivity.
  - platform: modbus_controller
    modbus_controller_id: ventilation
    name: Hygrostat
    register_type: discrete_input
    address: 0
    bitmask: 1
    force_new_range: true
    # Documented input; physical ON/OFF commissioning remains pending.

sensor:
  - platform: modbus_controller
    modbus_controller_id: ventilation
    id: temperature_t1
    name: Supply air temperature
    # on_online only fires after recovery; establish initial connectivity here.
    on_raw_value:
      then:
        - binary_sensor.template.publish:
            id: controller_online
            state: ON
    register_type: read
    address: 0
    value_type: U_WORD
    force_new_range: true
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    state_class: measurement
    device_class: temperature
    filters:
      - lambda: return (x - 300.0f) / 10.0f;
      - timeout: 90s

  - platform: modbus_controller
    modbus_controller_id: ventilation
    id: temperature_t3
    name: Outdoor air temperature
    register_type: read
    address: 2
    value_type: U_WORD
    force_new_range: true
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    state_class: measurement
    device_class: temperature
    filters:
      - lambda: return (x - 300.0f) / 10.0f;
      - timeout: 90s

  - platform: modbus_controller
    modbus_controller_id: ventilation
    id: temperature_t4
    name: Exhaust air temperature
    register_type: read
    address: 3
    value_type: U_WORD
    force_new_range: true
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    state_class: measurement
    device_class: temperature
    filters:
      - lambda: return (x - 300.0f) / 10.0f;
      - timeout: 90s

  - platform: modbus_controller
    modbus_controller_id: ventilation
    id: temperature_t7
    name: Extract air temperature
    register_type: read
    address: 6
    value_type: U_WORD
    force_new_range: true
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    state_class: measurement
    device_class: temperature
    filters:
      - lambda: return (x - 300.0f) / 10.0f;
      - timeout: 90s

  - platform: modbus_controller
    modbus_controller_id: ventilation
    id: temperature_t10
    name: Room temperature
    register_type: read
    address: 9
    value_type: U_WORD
    force_new_range: true
    unit_of_measurement: "°C"
    accuracy_decimals: 1
    state_class: measurement
    device_class: temperature
    filters:
      - lambda: return (x - 300.0f) / 10.0f;
      - timeout: 90s

  - platform: modbus_controller
    modbus_controller_id: ventilation
    id: humidity_percent
    name: Humidity
    register_type: read
    address: 10
    value_type: U_WORD
    force_new_range: true
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
    device_class: humidity
    filters:
      - timeout: 90s

  - platform: modbus_controller
    modbus_controller_id: ventilation
    id: bypass_percent
    name: Bypass position
    register_type: read
    address: 104
    value_type: U_WORD
    force_new_range: true
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
    filters:
      - lambda: |-
          if (!(x >= 0.0f && x <= 100.0f)) return NAN;
          return x == 99.0f ? 100.0f : x;
      - timeout: 90s

  - platform: modbus_controller
    modbus_controller_id: ventilation
    id: fan_supply_rpm
    name: Supply fan RPM (assumed)
    # Documented 3x0108; earlier live reads returned 0, not yet correlated.
    register_type: read
    address: 108
    value_type: U_WORD
    force_new_range: true
    unit_of_measurement: "rpm"
    accuracy_decimals: 0
    state_class: measurement
    icon: mdi:fan
    filters:
      - timeout: 90s

  - platform: modbus_controller
    modbus_controller_id: ventilation
    id: fan_extract_rpm
    name: Extract fan RPM (assumed)
    # Documented 3x0109; earlier live reads returned 0, not yet correlated.
    register_type: read
    address: 109
    value_type: U_WORD
    force_new_range: true
    unit_of_measurement: "rpm"
    accuracy_decimals: 0
    state_class: measurement
    icon: mdi:fan
    filters:
      - timeout: 90s

  - platform: modbus_controller
    modbus_controller_id: ventilation
    id: fan_supply_percent
    name: Supply fan output
    register_type: read
    address: 102
    value_type: U_WORD
    force_new_range: true
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
    filters:
      - timeout: 90s

  - platform: modbus_controller
    modbus_controller_id: ventilation
    id: fan_extract_percent
    name: Extract fan output
    register_type: read
    address: 103
    value_type: U_WORD
    force_new_range: true
    unit_of_measurement: "%"
    accuracy_decimals: 0
    state_class: measurement
    filters:
      - timeout: 90s

  - platform: modbus_controller
    modbus_controller_id: ventilation
    id: filter_reset_raw
    name: Filter reset register
    entity_category: diagnostic
    register_type: holding
    address: 105
    value_type: U_WORD
    force_new_range: true
    skip_updates: 1
    accuracy_decimals: 0
    filters:
      - timeout: 180s

select:
  - platform: modbus_controller
    modbus_controller_id: ventilation
    id: ventilation_level
    name: Ventilation level
    address: 100
    value_type: U_WORD
    force_new_range: true
    use_write_multiple: false
    optimistic: false
    optionsmap:
      "Off": 0
      "Level 1": 1
      "Level 2": 2
      "Level 3": 3
      "Level 4": 4

# Each field is polled separately with FC03, and written with one FC06.
# The shared write lambda bypasses ModbusNumber's optimistic state update.
# State changes only when the regular FC03 poll supplies a value.
number:
  - platform: modbus_controller
    modbus_controller_id: ventilation
    id: temperature_setpoint
    name: "Temperature setpoint"
    entity_category: config
    register_type: holding
    address: 0
    value_type: U_WORD
    force_new_range: true
    skip_updates: 1
    use_write_multiple: false
    min_value: 10
    max_value: 30
    step: 1
    mode: box
    unit_of_measurement: "°C"
    lambda: return x / 10.0f + 10.0f;
    write_lambda: &write_single_without_optimism |-
      if (!std::isfinite(x) || x != floorf(x) ||
          x < item->traits.get_min_value() || x > item->traits.get_max_value()) {
        return {};
      }
      const uint16_t raw = item->start_address == 0
          ? static_cast<uint16_t>((x - 10.0f) * 10.0f)
          : static_cast<uint16_t>(x);
      auto command = esphome::modbus_controller::ModbusCommandItem::create_write_single_command(
          id(ventilation), item->start_address, raw);
      id(ventilation)->queue_command(std::move(command));
      return {};

  - platform: modbus_controller
    modbus_controller_id: ventilation
    id: supply_level_1
    name: "Supply fan level 1"
    entity_category: config
    register_type: holding
    address: 6
    value_type: U_WORD
    force_new_range: true
    skip_updates: 1
    use_write_multiple: false
    min_value: 0
    max_value: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    write_lambda: *write_single_without_optimism

  - platform: modbus_controller
    modbus_controller_id: ventilation
    id: supply_level_2
    name: "Supply fan level 2"
    entity_category: config
    register_type: holding
    address: 7
    value_type: U_WORD
    force_new_range: true
    skip_updates: 1
    use_write_multiple: false
    min_value: 0
    max_value: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    write_lambda: *write_single_without_optimism

  - platform: modbus_controller
    modbus_controller_id: ventilation
    id: supply_level_3
    name: "Supply fan level 3"
    entity_category: config
    register_type: holding
    address: 8
    value_type: U_WORD
    force_new_range: true
    skip_updates: 1
    use_write_multiple: false
    min_value: 0
    max_value: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    write_lambda: *write_single_without_optimism

  - platform: modbus_controller
    modbus_controller_id: ventilation
    id: extract_level_1
    name: "Extract fan level 1"
    entity_category: config
    register_type: holding
    address: 9
    value_type: U_WORD
    force_new_range: true
    skip_updates: 1
    use_write_multiple: false
    min_value: 0
    max_value: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    write_lambda: *write_single_without_optimism

  - platform: modbus_controller
    modbus_controller_id: ventilation
    id: extract_level_2
    name: "Extract fan level 2"
    entity_category: config
    register_type: holding
    address: 10
    value_type: U_WORD
    force_new_range: true
    skip_updates: 1
    use_write_multiple: false
    min_value: 0
    max_value: 100
    step: 1
    mode: box
    unit_of_measurement: "%"
    write_lambda: *write_single_without_optimism

  - platform: modbus_controller
    modbus_controller_id: ventilation
    id: extract_level_3
    name: "Extract fan level 3"
