button:
  - platform: template
    name: Reset filter indicator
    id: filter_reset
    entity_category: config
    icon: mdi:air-filter
    # One explicit press writes 1 once. No restored state or boot automation.
    # The register can self-clear; its value is not proof of filter condition.
    on_press:
      - lambda: |-
          auto command = esphome::modbus_controller::ModbusCommandItem::create_write_single_command(
              id(ventilation), 105, 1);
          id(ventilation)->queue_command(std::move(command));
